name: Publish prototype to gh-pages

# Builds the prototype and pushes the static output to the `gh-pages` branch.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`. After that every push here updates
# https://tom-wfl.github.io/University-IP/ automatically.
#
# (The newer Actions-based Pages deploy needs the site created first, which the
# workflow token is not permitted to do — hence the branch approach.)

on:
  push:
    branches: [feature-intake/university-ip]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-prototype
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Build
        working-directory: prototype
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add /tmp/site --orphan gh-pages
          rm -rf /tmp/site/*
          cp -r prototype/dist/. /tmp/site/
          cd /tmp/site
          git add -A
          git commit -m "Publish prototype from ${GITHUB_SHA::7}" || {
            echo "No change to publish."
            exit 0
          }
          git push -f origin gh-pages
